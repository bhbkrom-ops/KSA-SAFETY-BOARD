name: KSA Safety Board Production Gate
on:
  push:
    branches:
      - main
      - "section-*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run quality
      - run: npm run audit:routes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-16-route-audit
          path: docs/audits/generated/
          if-no-files-found: warn
      - run: npm run build
